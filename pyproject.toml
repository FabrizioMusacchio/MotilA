[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "motila"
version = "1.1.3"
description = "MotilA: A pipeline for microglial motility analysis"
authors = [{ name = "Fabrizio Musacchio", email = "fabrizio.musacchio@posteo.de" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tifffile",
    "scikit-image",
    "scikit-learn",
    "zarr",
    "SimpleITK",
    "pystackreg",
    "pandas",
    "numcodecs",
    "openpyxl",
    "xlrd",
    "ipywidgets",
    "ipykernel", 
    "ipympl",
    "omio-microscopy",
    "PyYAML"
]

           
[project.urls]
Homepage = "https://github.com/fabriziomusacchio/motila"
Documentation = "https://github.com/fabriziomusacchio/motila#readme"
Source = "https://github.com/fabriziomusacchio/motila"
Tracker = "https://github.com/fabriziomusacchio/motila/issues"


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-copybutton"
]

[tool.pytest.ini_options]
addopts = "-p no:napari -p no:npe2 -p no:napari-plugin-engine"
testpaths = ["tests"]
